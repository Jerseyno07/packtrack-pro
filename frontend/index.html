<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PackTrack Pro</title>
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PackTrack" id="pwa-title" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" id="pwa-manifest" />
    <script>
      (function () {
        var p = location.pathname;
        var isOps = p.startsWith('/ops');
        var isReceipt = p.startsWith('/receipt');
        if (isOps || isReceipt) {
          document.getElementById('pwa-manifest').href = isOps ? '/manifest-ops.json' : '/manifest-receipt.json';
        }
        var t = document.getElementById('pwa-title');
        if (t) t.content = isOps ? 'PM Store Ops' : isReceipt ? 'Stock Receipt' : 'PackTrack Pro';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new Event('pwaready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaPrompt = null;
        window.dispatchEvent(new Event('pwainstalled'));
      });
    </script>
  </body>
</html>
