<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PackTrack — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { text-align: center; max-width: 320px; }
    .icon { width: 72px; height: 72px; background: #2563eb; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; font-family: system-ui, sans-serif; font-size: 2.5rem; font-weight: 900; color: white; line-height: 1; }
    h1 { color: #1e293b; font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.9rem; line-height: 1.5; }
    button { margin-top: 1.75rem; width: 100%; padding: 1rem; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">P</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your data is safe on the server.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
